[package]
name = "xtask"
description = "Rust-owned build, contract, header and quality tooling. Owners: Phase 01, Phase 15."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# Phase 13 (xtask cloud).
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Phase 01 (headers, edges, size, inventory, fixtures).
syn.workspace = true
proc-macro2.workspace = true
cargo_metadata.workspace = true
walkdir.workspace = true
regex.workspace = true
opencode-schema.workspace = true
# Phase 15 (distribution).
sha2.workspace = true
hex.workspace = true
flate2.workspace = true
tar.workspace = true
zip = { workspace = true, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true
