# Phase 90 provisional crate graph. Owner: Phase 90 (coordinator). Changes require a
# contract change request to the coordinator with an impact list.
#
# Each [crates.<dir>] entry declares the owning phase(s), the target class and the
# exact first-party normal/build dependencies it may use. Dev-dependencies may use
# any first-party crate as long as the combined normal+dev graph stays acyclic.
# "wasm" crates must compile for wasm32-unknown-unknown with their default features
# and must never resolve a native-only crate (platform-native, storage-sqlite,
# session-runtime, server, runtime, tools, integration-adapters).
#
# target = "portable" (native + wasm), "native", "wasm", "worker" (cloud wasm).

[crates.schema]
owner = ["01"]
target = "portable"
allow = []

[crates.protocol]
owner = ["06"]
target = "portable"
allow = ["schema"]

[crates.platform-api]
owner = ["05", "02"]
target = "portable"
allow = ["schema"]

[crates.platform-native]
owner = ["05"]
target = "native"
allow = ["schema", "platform-api"]

[crates.storage-api]
owner = ["02"]
target = "portable"
allow = ["schema"]

[crates.event-api]
owner = ["02"]
target = "portable"
allow = ["schema", "storage-api"]

[crates.storage-sqlite]
owner = ["02"]
target = "native"
allow = ["schema", "storage-api", "platform-api"]

[crates.event-store]
owner = ["02"]
target = "native"
allow = ["schema", "event-api", "storage-api", "storage-sqlite"]

[crates.config]
owner = ["02"]
target = "native"
allow = ["schema", "platform-api"]

[crates.locations]
owner = ["02"]
target = "native"
allow = ["schema", "platform-api", "config", "storage-api", "event-api"]

[crates.observability]
owner = ["15", "02"]
target = "native"
allow = ["schema"]

[crates.http-recorder]
owner = ["03", "15"]
target = "native"
allow = ["schema"]

[crates.llm-api]
owner = ["03"]
target = "portable"
allow = ["schema"]

[crates.provider-adapters]
owner = ["03"]
target = "native"
allow = ["schema", "llm-api", "config", "platform-api", "observability", "http-recorder"]

[crates.permissions]
