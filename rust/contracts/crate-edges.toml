[crates.tools]
owner = ["05"]
target = "native"
allow = ["schema", "tool-api", "permissions", "platform-api", "config", "session-api", "event-api", "storage-api", "llm-api"]

[crates.codemode]
owner = ["07"]
target = "portable"
