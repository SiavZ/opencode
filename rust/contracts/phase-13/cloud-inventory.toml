# Phase 13 cloud inventory. Hand-written from the baseline (sst.config.ts, infra/*.ts at
# 907b3bc5), independent of the generator. `cargo xtask cloud diff` fails when the generated
# plan for any checked stage is missing a row or emits an unlisted resource.
#
# mode: managed (provisioned), data (lookup), secret (sst.Secret input), linkable (sst.Linkable
# property bag), dev_command (sst dev only).
# when: always | production | non_production | deploy_aws (production, dev) |
#       monitoring (production, vimtor) | sst_dev (`sst dev` mode)
# Stage-dependent props (not presence) are covered by unit tests in xtask/src/cloud/tests.rs:
# SYNC_SERVER binding skipped for vimtor/adam, DO migration tag "" for production/thdxr,
# dev Go product/price IDs, preview empty migration URLs, alerts disabled outside production.

