reason = "Reviewed the complete real RunCoordinator state-machine matrix: joining resumes, coalescing wakes, failure/panic cleanup, interrupt cleanup racing successors, dropped waiters, independent keys and long trampoline drains. Shared watch latches and interrupt_cleanup_drain create deterministic comparisons between wake and resume races. A split along those operations would duplicate race fixtures and distribute transitions whose interaction is the actual contract. Keep these lifecycle assertions together; the file is test orchestration, not another runtime implementation."
