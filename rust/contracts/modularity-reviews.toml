reason = "Reviewed every async case and the shared Trace/Guard instrumentation. Eager calls, await, all/allSettled/race, timeout interruption and unsupported syntax compare starts, active maximum, completion and drop cleanup using the same real host tools. Splitting combinators away from cancellation would duplicate ownership instrumentation and weaken visibility of the lifecycle comparisons. The excess is primarily explicit JavaScript scenarios; keep this single promise lifecycle contract together."
author = "phase-07"
reviewer = "phase-05"
expires = "2026-11-19"

