# Modularity review records for files above 500 physical lines.
# Independent reviewer: mushroom, Phase 05 native/permissions owner, 2026-10-19.
# All 17 audit candidates were read in full. No exception is granted to desktop-host
# menu.rs, provider-adapters shared.rs, or gitlab_dws_discovery.rs: independent
# translation/catalog, media-validation, and cache/time boundaries require extraction.
# These short-lived exceptions preserve test-contract cohesion, not future growth.
# Header regeneration may change physical counts; refresh counts without broadening decisions.

[[review]]
path = "rust/crates/codemode/tests/codemode.rs"
lines = 1375
decision = "exception"
reason = "Reviewed the complete execution contract suite. Local host/callback fixtures and the shared orders signature connect execution, reusable execution, catalog discovery, output limits, and host-boundary failures through the real public API. Candidate splits at console/output and catalog sections would separate the baseline suite's execution-versus-discovery assertions and duplicate its host setup; common harness functionality is already in tests/common. Most size is explicit JavaScript and expected JSON, not another production responsibility. Retain this baseline-mapped integration suite until the expiry review rather than moving assertions solely to pass the size gate."
author = "phase-07"
reviewer = "phase-05"
expires = "2026-11-19"

[[review]]
path = "rust/crates/codemode/tests/openapi.rs"
lines = 1235
decision = "exception"
reason = "Reviewed generation, schema conversion, naming, serialization, auth and response controls against the same recording HttpClient/spec fixtures. The end-to-end case deliberately checks generated signatures and real execution requests together; auth/network ordering and collision cases use that same setup. Splitting generation from request execution would obscure their parity contract or introduce another test-fixture layer. Large inline OpenAPI documents and expected wire bodies account for the length. This is a bounded exception for one public OpenAPI generation-to-execution contract, not approval to add unrelated clients here."
author = "phase-07"
reviewer = "phase-05"
expires = "2026-11-19"

[[review]]
path = "rust/crates/codemode/tests/parity.rs"
lines = 664
decision = "exception"
reason = "Reviewed the full sandbox JavaScript parity matrix: undefined/coercion, branded errors, array/string operations, compound assignment, callback values and Date interactions. It contains public-execute inputs and baseline expectations, while reusable runners already live in tests/common. Splitting by builtin would distribute cross-value coercion and error invariants across suites without extracting implementation or reusable test machinery. Keep the baseline parity matrix together for this review period."
author = "phase-07"
reviewer = "phase-05"
expires = "2026-11-19"

[[review]]
