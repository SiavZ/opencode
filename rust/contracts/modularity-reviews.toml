lines = 624
decision = "exception"
reason = "Reviewed the common cassette runner and every Chat, compatible Chat, Responses, encrypted reasoning, image result and cache scenario. One runner compares recorded URL/body and independent golden events per turn, then builds the next request from the actual previous Rust response. Splitting by family would duplicate this continuation driver or create a second harness beyond the existing openai_common. The cross-family byte-versus-JSON comparison policy is explicit here because historical recordings differ; preserve that unified replay contract rather than moving scenario declarations to hide length."
author = "phase-03"
reviewer = "phase-05"
expires = "2026-11-19"

[[review]]
path = "rust/crates/provider-adapters/tests/openai_responses.rs"
lines = 874
decision = "exception"
reason = "Reviewed payload/options/tool/media, store-dependent reasoning references, streamed summary/encrypted metadata, hosted tools, errors and terminal events, HTTP auth and a real loopback WebSocket close/join control. Shared body/event constructors and openai_common already isolate reusable harness machinery. SSE-versus-WebSocket extraction would separate the same Responses terminal and payload contract across transports; request-versus-stream extraction would obscure encrypted-state continuation rules. Large literal event sequences and wire expectations justify retaining this protocol contract suite until expiry, without exempting future unrelated transports."
author = "phase-03"
reviewer = "phase-05"
expires = "2026-11-19"

[[review]]
