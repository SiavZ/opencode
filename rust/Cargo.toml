# Rust port workspace root. Owner: Phase 01 (tooling) under Phase 90 change control.
# Edits by other phases: append-only additions to [workspace.dependencies] via a
# minimal in-place edit. Never reorder, reformat or delete another team's entry.
# Every first-party crate edge must be allowed in contracts/crate-edges.toml.

[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
repository = "https://github.com/anomalyco/opencode"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"

[workspace.dependencies]
# First-party crates. Package names use the `opencode-` prefix, directories do not.
# A path entry may precede the crate's creation, cargo ignores unused entries.
opencode-schema = { path = "crates/schema" }
opencode-protocol = { path = "crates/protocol" }
opencode-platform-api = { path = "crates/platform-api" }
opencode-platform-native = { path = "crates/platform-native" }
opencode-config = { path = "crates/config" }
opencode-locations = { path = "crates/locations" }
opencode-storage-api = { path = "crates/storage-api" }
opencode-storage-sqlite = { path = "crates/storage-sqlite" }
opencode-event-api = { path = "crates/event-api" }
opencode-event-store = { path = "crates/event-store" }
opencode-observability = { path = "crates/observability" }
opencode-http-recorder = { path = "crates/http-recorder" }
opencode-llm-api = { path = "crates/llm-api" }
opencode-provider-adapters = { path = "crates/provider-adapters" }
opencode-session-api = { path = "crates/session-api" }
opencode-session-runtime = { path = "crates/session-runtime" }
opencode-context = { path = "crates/context" }
opencode-permissions = { path = "crates/permissions" }
opencode-tool-api = { path = "crates/tool-api" }
opencode-tools = { path = "crates/tools" }
opencode-integration-api = { path = "crates/integration-api" }
opencode-integration-adapters = { path = "crates/integration-adapters" }
opencode-codemode = { path = "crates/codemode" }
opencode-server = { path = "crates/server" }
opencode-client = { path = "crates/client" }
opencode-sdk-embedded = { path = "crates/sdk-embedded" }
opencode-view-model = { path = "crates/view-model" }
opencode-ui-web = { path = "crates/ui-web" }
opencode-ui-terminal = { path = "crates/ui-terminal" }
opencode-desktop-host = { path = "crates/desktop-host" }
opencode-hosted-domain = { path = "crates/hosted-domain" }
opencode-hosted-adapters = { path = "crates/hosted-adapters" }
opencode-ecosystem = { path = "crates/ecosystem" }
opencode-runtime = { path = "crates/runtime" }
opencode-test-support = { path = "crates/test-support" }

# Serialization and values. serde_json preserve_order keeps JS insertion order.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_with = "3.24.0"
serde_repr = "0.1.21"
schemars = "1.2.2"
jsonschema = { version = "0.58.5", default-features = false }
toml = "0.9.8"
json5 = "1.3.1"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
yaml-rust2 = "0.13.0"
quick-xml = "0.42.0"
indexmap = { version = "2.14.2", features = ["serde"] }
base64 = "0.23.1"
hex = "0.4.3"
bytes = "1.12.1"
url = { version = "2.5.8", features = ["serde"] }
percent-encoding = "2.3.2"
form_urlencoded = "1.2.2"
mime = "0.3.17"
mime_guess = "2.0.5"
semver = { version = "1.0.28", features = ["serde"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
rand = "0.10.3"
getrandom = "0.4.3"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
jiff = "0.2.37"
humantime = "2.4.0"
bytesize = "2.7.0"
rust_decimal = "1.43.0"
num-bigint = "0.5.1"
sha1 = "0.11.0"
sha2 = "0.11.0"
md-5 = "0.11.0"
hmac = "0.13.0"
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
encoding_rs = "0.8.42"
content_inspector = "0.2.4"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
smallvec = "1.16.2"
itertools = "0.15.0"
bitflags = "2.13.2"
strum = { version = "0.28.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["full"] }
once_cell = "1.21.4"
lru = "0.18.5"
moka = "0.12.16"
parking_lot = "0.12.5"
dashmap = "6.2.1"

# Errors and diagnostics. anyhow is for bins, xtask and tests only.
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
opentelemetry = "0.33.0"
opentelemetry_sdk = "0.33.0"
opentelemetry-otlp = "0.33.0"
tracing-opentelemetry = "0.34.0"

# Async runtime and networking. Crates enable only the tokio features they need.
tokio = { version = "1.53.1", default-features = false }
tokio-util = "0.7.19"
tokio-stream = "0.1.19"
futures = "0.3.34"
futures-util = "0.3.34"
async-trait = "0.1.92"
async-stream = "0.3.6"
pin-project-lite = "0.2.17"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = "1.11.1"
hyper-util = "0.1.21"
tower = "0.5.3"
tower-service = "0.3.3"
tower-http = "0.7.1"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = "0.12.6"
reqwest = { version = "0.13.5", default-features = false }
eventsource-stream = "0.2.3"
tokio-tungstenite = "0.30.0"
rustls = { version = "0.23.45", default-features = false }
tokio-rustls = "0.26.6"
rustls-native-certs = "0.8.4"
