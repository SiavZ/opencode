[workspace]
# Standalone workspace for Phase 11 connections spike.
# Excluded from the main workspace to avoid breaking other agents.

[package]
name = "p11-connections-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
opencode-desktop-host = { path = "../../crates/desktop-host" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["rustls"] }
tempfile = "3"
anyhow = "1"
axum = "0.7"

[dev-dependencies]
tower = "0.5"
libc = "0.2"
