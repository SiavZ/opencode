[package]
name = "opencode-integration-adapters"
description = "Native MCP, LSP, ACP and plugin-host adapters. Owner: Phase 07."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "opencode_integration_adapters"

# Children of p07 append their own dependency lines below, one edit at a time. Do not reorder.
[dependencies]
opencode-integration-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "io-util", "net", "fs"] }
tokio-util.workspace = true
# p07.mcp deps
reqwest = { workspace = true, features = ["rustls", "stream", "json", "form"] }
axum.workspace = true
base64.workspace = true
sha2.workspace = true
getrandom.workspace = true
bytes.workspace = true
nix = { workspace = true, features = ["signal"] }
# p07.lsp deps
url.workspace = true
which.workspace = true
regex.workspace = true
# p07.acp deps
# p07.plugins deps
semver.workspace = true
fs4.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile.workspace = true

[lints]
workspace = true
