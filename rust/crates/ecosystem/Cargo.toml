[package]
name = "opencode-ecosystem"
description = "GitHub Action/CLI automation, OIDC/App token exchange, Feishu bridge, Slack Socket Mode and VS Code editor logic. Owner: Phase 14."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "opencode_ecosystem"

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
rand.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["json", "query", "rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "process", "net", "io-util", "fs"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
