[package]
name = "opencode-platform-native"
description = "Native filesystem, watcher, process, PTY, git, snapshot, worktree and formatter adapters. Owner: Phase 05."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "opencode_platform_native"

[dependencies]
portable-pty.workspace = true
opencode-schema.workspace = true
opencode-platform-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "fs", "io-util", "process", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
globset.workspace = true
walkdir.workspace = true
notify.workspace = true
dirs.workspace = true
encoding_rs.workspace = true
sha1.workspace = true
uuid.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
