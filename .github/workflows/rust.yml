name: Rust

on:
  push:
    branches: [dev, rust-port]
    paths: ["rust/**", "packages/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "packages/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Pinned toolchain and locked dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
          cargo fetch --locked
      - name: Focused gate regression tests (integration target, nonzero count)
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -o pipefail
          cargo test --locked --offline -p xtask --test gates -- --nocapture | tee "$RUNNER_TEMP/gate-tests.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/gate-tests.log"
      - name: Distribution tests live in the binary target
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -o pipefail
          cargo test --locked --offline -p xtask --bin xtask distribution::tests -- --nocapture | tee "$RUNNER_TEMP/distribution-tests.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/distribution-tests.log"
      - name: Tooling lint
        run: cargo clippy --locked --offline -p xtask --all-targets -- -D warnings
      - name: Structural gates and strict production parity (no conformance bypass)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo run --locked --offline -p xtask -- check
      - name: Portable default-feature compilation
        if: ${{ !cancelled() }}
        run: |
          cargo check --locked --offline --target wasm32-unknown-unknown -p opencode-schema -p opencode-protocol -p opencode-platform-api -p opencode-storage-api -p opencode-event-api -p opencode-llm-api -p opencode-permissions -p opencode-tool-api -p opencode-session-api -p opencode-codemode -p opencode-integration-api -p opencode-client -p opencode-view-model -p opencode-ui-web -p opencode-hosted-domain

  native:
    strategy:
      fail-fast: false
      matrix:
          os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target/ci-native
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Pinned toolchain and locked dependencies
        id: dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo fetch --locked
          cargo fetch --locked --manifest-path tests/acceptance/Cargo.toml
      - name: Isolate product state
        id: isolation
        run: |
          mkdir -p "$RUNNER_TEMP/rust-home" "$RUNNER_TEMP/rust-data" "$RUNNER_TEMP/rust-config" "$RUNNER_TEMP/rust-cache" "$RUNNER_TEMP/rust-state" "$RUNNER_TEMP/rust-tmp"
          {
            echo "CARGO_HOME=$HOME/.cargo"
            echo "RUSTUP_HOME=$HOME/.rustup"
            echo "HOME=$RUNNER_TEMP/rust-home"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/rust-data"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/rust-config"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/rust-cache"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/rust-state"
            echo "TMPDIR=$RUNNER_TEMP/rust-tmp"
            echo "CARGO_NET_OFFLINE=true"
          } >> "$GITHUB_ENV"
      - name: Native compilation through the shipped package
        run: cargo check --locked --offline -p opencode --all-targets
      - name: Real native PTY spawn, IO, resize, removal and joined shutdown
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test --locked --offline -p opencode-platform-native --test pty native_pty_write_read_resize_remove_and_shutdown -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/rust-pty-tests.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/rust-pty-tests.log"
      - name: Native runtime, HTTP, permission and filesystem integration
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test --locked --offline -p opencode-runtime -p opencode-server -p opencode-platform-native -p opencode-permissions -p opencode --tests 2>&1 | tee "$RUNNER_TEMP/rust-runtime-tests.log"
      - name: Embedded SDK real Process, global tools and joined disposal
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test --locked --offline -p opencode-sdk-embedded --features embedded --test embedded --test embedded_tools 2>&1 | tee "$RUNNER_TEMP/rust-embedded-tests.log"
      - name: Desktop lifecycle and real terminal PTY integration
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test --locked --offline -p opencode-desktop-host -p opencode-ui-terminal --tests 2>&1 | tee "$RUNNER_TEMP/rust-terminal-tests.log"
      - name: Build real native release archive and verify its checksums, SBOM and contents
        id: package
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          cargo run --locked --offline -p xtask -- distribution build --package opencode --bin opencode --out "$RUNNER_TEMP/rust-dist"
          cargo run --locked --offline -p xtask -- distribution verify --dir "$RUNNER_TEMP/rust-dist"
          mkdir -p "$RUNNER_TEMP/rust-extracted"
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, sys, tarfile, zipfile
          root = pathlib.Path(sys.argv[1])
          archives = list((root / "rust-dist").glob("*.zip")) + list((root / "rust-dist").glob("*.tar.gz"))
          assert len(archives) == 1, f"expected exactly one host archive, got {archives}"
          archive = archives[0]
          destination = root / "rust-extracted"
          if archive.suffix == ".zip":
              with zipfile.ZipFile(archive) as source:
                  source.extractall(destination)
          else:
              with tarfile.open(archive) as source:
                  source.extractall(destination, filter="data")
          binary = destination / "opencode"
          assert binary.is_file(), f"missing extracted executable: {binary}"
          binary.chmod(0o755)
          PY
          "$RUNNER_TEMP/rust-extracted/opencode" --version
      - name: Acceptance harness tests
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: cargo test --locked --offline --manifest-path tests/acceptance/Cargo.toml
      - name: Actual packaged-executable acceptance, no blocked candidate rows
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          CANDIDATE_CMD: ${{ runner.temp }}/rust-extracted/opencode
        run: |
          cargo run --locked --offline --manifest-path tests/acceptance/Cargo.toml --bin acceptance -- --out "$RUNNER_TEMP/rust-acceptance.jsonl"
          python3 - "$RUNNER_TEMP/rust-acceptance.jsonl" <<'PY'
          import json, pathlib, sys
          rows = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          candidates = [row for row in rows if row["workflow"].endswith(" (candidate)")]
          assert len(candidates) == 3, f"expected all 3 candidate workflows, got {len(candidates)}"
          assert all(row["gate_decision"].startswith("pass") for row in candidates), candidates
          PY
      - name: Preserve acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-acceptance-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/rust-acceptance.jsonl
            ${{ runner.temp }}/rust-runtime-tests.log
            ${{ runner.temp }}/rust-terminal-tests.log
            ${{ runner.temp }}/rust-pty-tests.log
            ${{ runner.temp }}/rust-embedded-tests.log
          if-no-files-found: warn

  windows-native:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Pinned native Windows toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path tests/acceptance/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Isolate Windows product state
        id: isolation
        run: |
          $root = Join-Path $env:RUNNER_TEMP "rust-state"
          "home", "data", "config", "cache", "state", "tmp", "appdata", "localappdata" | ForEach-Object {
            New-Item -ItemType Directory -Force -Path (Join-Path $root $_) | Out-Null
          }
          @(
            "CARGO_HOME=$env:USERPROFILE/.cargo"
            "RUSTUP_HOME=$env:USERPROFILE/.rustup"
            "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE/rust/target/ci-windows"
            "CARGO_NET_OFFLINE=true"
            "HOME=$root/home"
            "USERPROFILE=$root/home"
            "APPDATA=$root/appdata"
            "LOCALAPPDATA=$root/localappdata"
            "XDG_DATA_HOME=$root/data"
            "XDG_CONFIG_HOME=$root/config"
            "XDG_CACHE_HOME=$root/cache"
            "XDG_STATE_HOME=$root/state"
            "TEMP=$root/tmp"
            "TMP=$root/tmp"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile shipped Windows executable and test targets
        run: cargo check --locked --offline -p opencode --all-targets
      - name: Real Windows ConPTY spawn, IO, resize, removal and joined shutdown
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          cargo test --locked --offline -p opencode-platform-native --test pty native_pty_write_read_resize_remove_and_shutdown -- --exact --nocapture 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/rust-pty-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Select-String -Path "$env:RUNNER_TEMP/rust-pty-tests.log" -Pattern 'test result: ok\. [1-9][0-9]* passed' -Quiet)) { throw "Real Windows PTY test did not execute" }
      - name: Native Windows runtime, HTTP, permission and filesystem integration
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          cargo test --locked --offline -p opencode-runtime -p opencode-server -p opencode-platform-native -p opencode-permissions -p opencode --tests 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/rust-runtime-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows embedded SDK real Process, global tools and joined disposal
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          cargo test --locked --offline -p opencode-sdk-embedded --features embedded --test embedded --test embedded_tools 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/rust-embedded-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows desktop lifecycle and terminal tests
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          cargo test --locked --offline -p opencode-desktop-host -p opencode-ui-terminal --tests 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/rust-terminal-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify real Windows release archive
        id: package
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          cargo run --locked --offline -p xtask -- distribution build --package opencode --bin opencode --out "$env:RUNNER_TEMP/rust-dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked --offline -p xtask -- distribution verify --dir "$env:RUNNER_TEMP/rust-dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/rust-dist/*.zip")
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows archive, got $($archives.Count)" }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath "$env:RUNNER_TEMP/rust-extracted"
          if (!(Test-Path "$env:RUNNER_TEMP/rust-extracted/opencode.exe")) { throw "Archive lacks opencode.exe" }
          & "$env:RUNNER_TEMP/rust-extracted/opencode.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows acceptance harness tests
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: cargo test --locked --offline --manifest-path tests/acceptance/Cargo.toml
      - name: Actual packaged Windows executable acceptance, no blocked candidate rows
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          $env:CANDIDATE_CMD = "'" + ("$env:RUNNER_TEMP/rust-extracted/opencode.exe" -replace '\\', '/') + "'"
          cargo run --locked --offline --manifest-path tests/acceptance/Cargo.toml --bin acceptance -- --out "$env:RUNNER_TEMP/rust-acceptance.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = @(Get-Content "$env:RUNNER_TEMP/rust-acceptance.jsonl" | ForEach-Object { $_ | ConvertFrom-Json })
          $candidates = @($rows | Where-Object { $_.workflow.EndsWith(" (candidate)") })
          if ($candidates.Count -ne 3) { throw "Expected 3 candidate workflows, got $($candidates.Count)" }
          $failures = @($candidates | Where-Object { !$_.gate_decision.StartsWith("pass") })
          if ($failures.Count -ne 0) { throw ($failures | ConvertTo-Json -Depth 20) }
      - name: Preserve Windows native execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-acceptance-windows-2025
          path: |
            ${{ runner.temp }}/rust-acceptance.jsonl
            ${{ runner.temp }}/rust-runtime-tests.log
            ${{ runner.temp }}/rust-terminal-tests.log
            ${{ runner.temp }}/rust-pty-tests.log
            ${{ runner.temp }}/rust-embedded-tests.log
          if-no-files-found: warn
